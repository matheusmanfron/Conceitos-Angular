<main class="dashboard-container">
  
  <header class="cabecalho">
    <h1>🏆 {{ titulo }} 🏆</h1>
    <div class="placar-geral">
      TOTAL DE GOLS NA RODADA: <span>{{ totalGolsRodada }}</span>
    </div>
  </header>

  <section class="campo">
    <app-selecao-card 
      *ngFor="let selecao of listaSelecoes"
      [nomeTime]="selecao.pais"
      [bandeira]="selecao.flag"
      (golMarcado)="registrarGolSelecao($event)"> </app-selecao-card>
  </section>
  

<app-placar-partida
  [nomeTimeA]="'Alemanha'"
  [nomeTimeB]="'Argentina'"
  (golMarcado)="registrarGolPartida($event)"> </app-placar-partida>

</main>
